<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gesture – Sign Language Translator UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icons (Lucide via SVG) -->
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>

<body class="min-h-screen bg-[#0F172A] flex items-center justify-center p-6">

  <div class="w-full max-w-md space-y-6">

    <!-- Header -->
    <div class="space-y-3 text-center">
      <div class="flex justify-center">
        <div class="bg-gradient-to-r from-[#5B6FDB] to-[#8B5FBF] rounded-full px-6 py-3 flex items-center gap-3 shadow-lg shadow-purple-500/30">
          <span class="text-white">⏻</span>
          <span class="text-white font-medium">Gesture</span>
          <span class="text-white">✨</span>
        </div>
      </div>
      <p class="text-[#60A5FA] text-sm">Real-time gesture recognition</p>
    </div>

    <!-- Target Language -->
    <div class="space-y-3">
      <div class="flex items-center gap-2 text-white text-sm">
        🌍 <span>Target Language</span>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <button onclick="selectLang(this)" class="lang-btn selected">
          <div class="text-xl mb-1">GB</div>
          <div class="text-sm">English</div>
        </button>

        <button onclick="selectLang(this)" class="lang-btn">
          <div class="text-xl mb-1">IN</div>
          <div class="text-sm">हिंदी</div>
        </button>

        <button onclick="selectLang(this)" class="lang-btn">
          <div class="text-3xl mb-1">🟡</div>
          <div class="text-sm">ಕನ್ನಡ</div>
        </button>
      </div>
    </div>

    <!-- Camera Preview -->
    <div class="relative bg-gradient-to-br from-[#1E293B] to-[#4C1D95]/30 rounded-3xl p-8 min-h-[280px] flex flex-col items-center justify-center border border-[#334155]">
      <div class="absolute top-4 left-4 border border-white/50 rounded px-3 py-1 text-white/80 text-sm">
        Preview
      </div>

      <div class="space-y-4 text-center">
        📷
        <p class="text-white/60 text-sm">Camera ready</p>
      </div>
    </div>

    <!-- Start Button -->
    <button class="w-full bg-[#10B981] hover:bg-[#059669] text-white rounded-2xl py-4 shadow-lg shadow-emerald-500/30">
      ⏻ Start Translating
    </button>

    <!-- Recent Translations -->
    <div class="bg-[#1E293B] rounded-3xl p-5 space-y-3 border border-[#334155]">
      <div class="flex items-center gap-2 text-white text-sm mb-3">
        ⚡ <span>Recent Translations</span>
      </div>

      <div class="space-y-2">
        <div class="item">Hello ✓</div>
        <div class="item">Thank you ✓</div>
        <div class="item">Good morning ✓</div>
        <div class="item">How are you? ✓</div>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-[#60A5FA]/60 text-xs">✨ Designed for accessibility</p>

  </div>

  <!-- Styles -->
  <style>
    .lang-btn {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 1rem;
      aspect-ratio: 1 / 1;
      color: white;
      transition: all 0.2s ease;
    }

    .lang-btn.selected {
      background: #06B6D4;
      box-shadow: 0 0 30px rgba(6,182,212,0.6);
      color: #0A1929;
    }

    .item {
      background: #2D3B52;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      color: white;
      display: flex;
      justify-content: space-between;
    }
  </style>

  <!-- Script -->
  <script>
    function selectLang(btn) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }
  </script>

</body>
</html>
